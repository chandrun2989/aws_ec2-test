name: Check PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body;
            // Regex enforces: type(scope)!: description
            // Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
            const regex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-._]+\))?!?: .+$/;
            
            if (!regex.test(title)) {
              core.setFailed(
                `PR Title "${title}" is invalid.\n` +
                `It must follow Conventional Commits format: type(scope): description\n` +
                `Make sure you include the colon and space after the type.\n` +
                `Examples:\n` +
                `  feat: add login page\n` +
                `  fix(api): resolve timeout issue\n` +
                `  feat!: drop support for v1`
              );

             }
            
            const checklistRegex = /- \[([xX])?\]\s/;
            const checklistMatches = body.matchAll(checklistRegex);
            let checkedCount = 0;
            for (const match of checklistMatches) {
              if (match[1] && (match[1].toLowerCase() === 'x')) {
                checkedCount++;
              }
            } 
             }
              const jiraRegex = /[a-zA-Z]{4}-\d{4}/;
              if (!jiraRegex.test(title) && !jiraRegex.test(body)) {
                core.setFailed(
                  "PR Title or body must contain a valid JIRA number in the format ABCD-1234.\n" +
                  "Please add the JIRA number to either the title or body of the pull request."
              );
            } else {
              core.info("PR Title is valid.");
            }
            if (checkedCount === 0) {
              core.setFailed(
                "At least one checklist item must be selected in the PR body.\n" +
                "Please check at least one box in the checklist."
              );
            } else {
              core.info("At least one checklist item is selected.");
            }