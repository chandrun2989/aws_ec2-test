name: Auto version & on PR merge
on:
  pull_request:
    types: [closed, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
      
      - name: Set up git user
        run: |
          echo "Configuring git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: get bump type 
        id: incver
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            core.info(`Starting version bump check for PR #${pr.number}`);
            const labels = (pr.labels || []).map(l => (l.name || '').toLowerCase());
            core.info(`PR Labels: ${JSON.stringify(labels)}`);
            const preferLabels = () => {
              if (labels.includes('semver: major') || labels.includes('major')) return 'major';
              if (labels.includes('semver: minor') || labels.includes('minor')) return 'minor';
              if (labels.includes('semver: patch') || labels.includes('patch')) return 'patch';
              return null;
            };

            let bump = preferLabels();
            if (bump) {
              core.info(`Bump type determined from labels: ${bump}`);
            }
            if (!bump) {
              core.info(`No semver label found. Analyzing commits...`);
              const { owner, repo} = context.repo;
              const { data: commits } = await github.rest.pulls.listCommits({
                owner,
                repo,
                pull_number: pr.number, per_page: 100
              });
              core.info(`Fetched ${commits.length} commits.`);

              let major = false, minor = false, patch = false;
              for (const c of commits) {
                const msg = c.commit.message || '';
                const first = msg.split('\n')[0];
                
                // Major if BREAKING CHANGE in body or "type!: ..." bang syntax
                if (/BREAKING CHANGE/.test(msg) || /^[a-zA-Z]+![:(]/.test(first)) {
                  core.info(`Found breaking change in commit: ${first}`);
                  major = true;
                  continue; }
                if (/^feat(\(.+\))?:/.test(first)) {
                  minor = true;
                  continue; }
                if (/^fix(\(.+\))?:/.test(first)) {
                  patch = true;
                  continue; }
              }
              bump = major ? 'major' : (minor ? 'minor' : 'patch');
              core.info(`Bump type determined from commits: ${bump}`);
            }
            core.info(`Final bump type: ${bump}`);
            core.setOutput('bump', bump);

      - name: Get the latest tag
        id: prev
        shell: bash
        run: |
          set -e
          echo "Fetching latest tag..."
          # find last tag that looks like v<semver>; default  to v0.0.0
          TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag found: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compute next version
        id: semver
        shell: bash
        run: |
          set -e
          CUR="${{ steps.prev.outputs.tag }}"
          BUMP="${{ steps.incver.outputs.bump }}"
          echo "Current version: $CUR"
          echo "Bump type: $BUMP"
          V="${CUR#v}"  # strip leading 'v'
          IFS='.' read -r MA MI PA <<< "$V"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          echo "Parsed version - Major: $MA, Minor: $MI, Patch: $PA"
          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          NEW="v${MA}.${MI}.${PA}"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Computed new version: $NEW (from $CUR, bump: $BUMP)"

      # optional: Persist the version to a generic version file and push to base branch
      # If repo is language-specific, replace this with updating package.json, setup.py, etc.
      - name: write version file and commits
        shell: bash
        continue-on-error: true # avoid failing if branch protections block pushes
        env:
          NEW: ${{ steps.semver.outputs.new }}
        run: |
          echo "Updating VERSION file to $NEW"
          echo "${NEW}" > VERSION
          if git diff --quiet VERSION; then
            echo "Version unchanged."
          else
          echo "Commiting VERSION file...."
          git add VERSION
          git commit -m "chore(release): ${NEW} [skip ci]"
          echo "Pushing to ${{ github.event.pull_request.base.ref }}..."
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
          fi
      
      - name: Create Git tag and push
        shell: bash
        env:
          NEW: ${{ steps.semver.outputs.new }}
        run: |
          # ensure tag does not already exist
          echo "Checking if tag $NEW already exists..."
          if git rev-parse "$NEW" >/dev/null 2>&1; then
            echo "Tag $NEW already exists, skipping tag creation."
          else
          echo "Creating and pushing tag $NEW..."
          git tag "$NEW" -m "Release $NEW"
          git push origin "$NEW"
          fi