name: "Fetch secret from AWS Secrets Manager"
description: "Fetches a secret from AWS Secrets Manager. Supports plain text or JSON-formatted secrets."

inputs:
  secret:
    description: "The AWS Secrets Manager secret ID."
    required: true
  key:
    description: "The key name within the secret's JSON to extract. Leave empty for plain text secrets."
    required: false

outputs:
  key:
    description: "The secret value if treated as a raw string (e.g., an SSH key)."
    value: ${{ steps.parse_secret.outputs.key }}
  token:
    description: "The value extracted from a JSON secret using the provided 'key' input."
    value: ${{ steps.parse_secret.outputs.token }}

runs:
  using: "composite"
  steps:
    - name: fetch Secrets Manager secret
      id: get_aws_secret
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret_id: ${{ inputs.secret }}
        parse-json-secrets: false

    - name: Parse secret
      id: parse_secret
      shell: bash
      run: |
        SECRET_JSON_PAYLOAD='${{ steps.get_aws_secret.outputs.secret-values-json }}'
        SECRET_ID='${{ inputs.secret }}'
        SECRET_KEY_NAME='${{ inputs.key }}'

        # Extract the raw secret value from the JSON payload returned by the 'get-secrets' action
        SECRET_VALUE=$(echo "$SECRET_JSON_PAYLOAD" | jq -r --arg SECRET_ID "$SECRET_ID" '.[$SECRET_ID]')

        # Check if a 'key' input was provided and if the secret value is valid JSON containing that key
        if [[ -n "$SECRET_KEY_NAME" ]] && echo "$SECRET_VALUE" | jq -e --arg KEY "$SECRET_KEY_NAME" '.[$KEY]' >/dev/null 2>&1; then
          # It's JSON and the key exists. Extract it for the 'token' output.
          EXTRACTED_TOKEN=$(echo "$SECRET_VALUE" | jq -r --arg KEY "$SECRET_KEY_NAME" '.[$KEY]')
          echo "::add-mask::$EXTRACTED_TOKEN"
          echo "token=$EXTRACTED_TOKEN" >> "$GITHUB_OUTPUT"
          echo "key=" >> "$GITHUB_OUTPUT"
        else
          # It's a plain string, or it's JSON but the 'key' wasn't found/provided.
          # Use the whole secret for the 'key' output. This handles multiline values like SSH keys.
          echo "token=" >> "$GITHUB_OUTPUT"
          # Mask the value before outputting. The heredoc for GITHUB_OUTPUT handles multiline.
          SECRET_VALUE_ESCAPED="${SECRET_VALUE//$'\n'/'%0A'}"
          echo "::add-mask::$SECRET_VALUE_ESCAPED"
          {
            echo "key<<EOF"
            echo "$SECRET_VALUE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi


